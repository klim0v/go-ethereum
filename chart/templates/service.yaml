apiVersion: v1
kind: Service
metadata:
  name: {{ include "tool-node.fullname" . }}
  labels:
    app: {{ include "tool-node.name" . }}
spec:
  type: ClusterIP
  selector:
    app: {{ include "tool-node.name" . }}
  ports:
    - port: 8545
      targetPort: 8545
      protocol: TCP
      name: http-rpc
    - port: 8546
      targetPort: 8546
      protocol: TCP
      name: ws-rpc
    - name: p2p-tcp
      port: 30303
      targetPort: 30303
      protocol: TCP
    - name: p2p-udp
      port: 30303
      targetPort: 30303
      protocol: UDP
    - name: authrpc
      port: 8551
      targetPort: 8551
    - name: custom
      port: 9060
      targetPort: 9060
    - name: metrics
      port: 6060
      targetPort: 6060
